<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Group ZPRJ is building something new. Launching soon.">
  <meta name="theme-color" content="#0e0f12">
  <title>Group ZPRJ — Coming soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0f12'/%3E%3Cpath d='M18 18h28L18 46h28' fill='none' stroke='%237aa2ff' stroke-width='6' stroke-linecap='square'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0f12;
      --surface: #16181d;
      --line: #262a33;
      --text: #eceef2;
      --muted: #8f96a3;
      --accent: #7aa2ff;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(60rem 30rem at 50% -10%, rgba(122,162,255,.10), transparent 70%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 30rem;
      padding: 3rem 2rem 2.25rem;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
      animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .4rem .85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .85rem;
    }
    .dot {
      width: .5rem; height: .5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(122,162,255,.6);
      animation: pulse 2.4s infinite;
    }
    h1 {
      margin: 1.75rem 0 .75rem;
      font-size: clamp(2.25rem, 9vw, 3rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.05;
    }
    p {
      margin: 0 auto;
      max-width: 24rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 2rem 0 1.5rem;
    }
    .contact { font-size: .95rem; color: var(--muted); }
    .contact a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(122,162,255,.35);
      padding-bottom: 1px;
      overflow-wrap: anywhere;
      transition: border-color .2s;
    }
    .contact a:hover { border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 .6rem rgba(122,162,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(122,162,255,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      main, .dot { animation: none; }
    }
    @media (max-width: 420px) { main { padding: 2.25rem 1.25rem 1.75rem; } }
  </style>
</head>
<body>
  <main>
    <span class="status"><span class="dot" aria-hidden="true"></span>Coming soon</span>
    <h1>Group ZPRJ</h1>
    <p>Something new is in development. Check back soon for updates.</p>
    <hr>
    <div class="contact">Questions or partnerships? <a href="mailto:contact@groupzprj.bond">contact@groupzprj.bond</a></div>
  </main>
</body>
</html>
